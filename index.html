<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ships opinion table</title>
    <!-- Підключаємо шрифт Typewriter -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <!-- Підключаємо бібліотеку для створення скріншоту таблиці -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Підключаємо бібліотеку для стиснення даних у посиланні -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <style>
        :root {
            /* Базові змінні, які будуть перезаписуватись темами */
            --bg-body: #e0ddd5;
            --bg-paper: #fdfaf6;
            --text-main: #111;
            --border-main: #111;
            --btn-bg: white;
            --btn-text: #111;
            --btn-hover: #f0f0f0;
            --btn-active: #111;
            --btn-active-text: white;
            
            /* Кольори легенди */
            --color-default: transparent;
            --color-love: #d9534f;
            --color-like: #f0ad4e;
            --color-platonic: #e4d836;
            --color-neutral: #8fbc8f;
            --color-dislike: #5bc0de;
            --color-hate: #9c66a4;
            --color-custom1: transparent;
            --color-custom2: transparent;
        }

        body {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .settings-row {
            display: flex;
            gap: 10px;
            background: var(--bg-paper);
            padding: 10px;
            border-radius: 4px;
            border: 2px solid var(--border-main);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            align-items: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .settings-label {
            font-weight: bold;
            margin-right: 10px;
            text-transform: uppercase;
        }

        .setting-btn {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            padding: 6px 12px;
            border: 2px solid var(--border-main);
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .setting-btn:hover { background: var(--btn-hover); }
        .setting-btn.active {
            background: var(--btn-active);
            color: var(--btn-active-text);
            border-color: var(--btn-active);
        }

        .marker-input {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            padding: 6px;
            border: 1px solid var(--border-main);
            background: var(--bg-paper);
            color: var(--text-main);
            border-radius: 4px;
            width: 140px;
            font-size: 14px;
        }
        .marker-input:focus { outline: 2px solid var(--border-main); }
        
        .score-input { width: 60px; text-align: center; }

        /* Custom Checkbox */
        .custom-checkbox-wrapper {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .custom-checkbox-input {
            display: none;
        }
        .custom-checkbox-box {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-main);
            background: var(--bg-paper);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            line-height: 1;
            transition: background-color 0.2s, color 0.2s;
        }
        .custom-checkbox-wrapper:hover .custom-checkbox-box {
            background: var(--btn-hover);
        }
        .custom-checkbox-input:checked + .custom-checkbox-box {
            background: var(--border-main);
            color: var(--bg-paper);
        }
        .custom-checkbox-input:checked + .custom-checkbox-box::after {
            content: '✓';
        }

        #custom-palette-settings {
            display: none; width: 100%; flex-wrap: wrap; gap: 15px; padding-top: 10px;
            border-top: 1px dashed var(--border-main); margin-top: 5px;
        }

        .color-picker-group { display: flex; align-items: center; gap: 5px; }
        .color-picker-group label { font-size: 14px; font-weight: bold; }

        input[type="color"] {
            -webkit-appearance: none; border: 1px solid var(--border-main);
            width: 30px; height: 30px; padding: 0; background: none; cursor: pointer;
            border-radius: 4px;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

        #capture-area {
            background-color: var(--bg-paper); padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 1000px; width: 100%;
            box-sizing: border-box; border: 2px solid var(--border-main);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 25px; flex-wrap: wrap; gap: 20px;
        }

        .title {
            font-size: 34px; font-weight: bold; line-height: 1.2; margin: 0;
            max-width: 400px; text-transform: uppercase; letter-spacing: -1px;
            color: var(--text-main); transition: color 0.3s; word-wrap: break-word;
        }

        .legend {
            border: 2px solid var(--border-main); padding: 10px 20px; display: grid;
            grid-template-columns: 1fr 1fr; gap: 15px 30px; background: var(--bg-paper);
        }

        .legend-item {
            display: flex; align-items: center; font-size: 18px; font-weight: bold;
            color: var(--text-main); cursor: pointer; padding: 4px; border-radius: 4px; border: 2px solid transparent;
        }
        .legend-item:hover { background-color: rgba(0,0,0,0.05); }
        .legend-item.active-brush { border-color: var(--border-main); background-color: var(--btn-hover); transform: scale(1.05); }
        
        .mode-indicator {
            width: 100%; text-align: center; margin-bottom: 15px; font-size: 14px; font-style: italic; opacity: 0.8;
        }

        .color-box { width: 26px; height: 26px; margin-right: 12px; border: 2px solid var(--border-main); }

        table {
            width: 100%; border-collapse: collapse; table-layout: fixed;
            border: 2px solid var(--border-main); background-color: var(--bg-paper);
        }

        td {
            border: 1px solid var(--border-main); padding: 6px 4px; font-size: 13px;
            letter-spacing: -0.2px; font-weight: bold; cursor: pointer; user-select: none;
            background-color: var(--color-default); height: auto; min-height: 45px;
            text-align: left; color: var(--text-main);
            word-break: normal; word-wrap: break-word; overflow-wrap: break-word; 
            hyphens: none; line-height: 1.15; vertical-align: middle;
        }

        td:hover { opacity: 0.85; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }

        .bg-default { background-color: var(--color-default); }
        .bg-love { background-color: var(--color-love); }
        .bg-like { background-color: var(--color-like); }
        .bg-platonic { background-color: var(--color-platonic); }
        .bg-neutral { background-color: var(--color-neutral); }
        .bg-dislike { background-color: var(--color-dislike); }
        .bg-hate { background-color: var(--color-hate); }
        .bg-custom1 { background-color: var(--color-custom1); }
        .bg-custom2 { background-color: var(--color-custom2); }

        /* Spectrum Bar Styles */
        #spectrum-container {
            margin-top: 40px; width: 100%; padding: 10px 0;
            border-top: 2px dashed var(--border-main);
        }
        .spectrum-labels-top {
            position: relative; height: 24px; font-weight: bold; font-size: 18px; margin-bottom: 8px;
        }
        #ui-gradient-bar {
            position: relative; height: 24px; width: 100%; border: 2px solid var(--border-main);
            border-radius: 12px; background-color: var(--color-default);
        }
        #ui-spec-marker {
            position: absolute; top: -6px; height: 36px; width: 6px;
            background-color: var(--text-main); border-radius: 3px;
            transform: translateX(-50%); transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 0 2px var(--bg-paper); z-index: 2;
        }
        #ui-gradient-labels {
            position: relative; height: 20px; margin-top: 8px;
        }

        /* Controls & Modals */
        .controls { margin-top: 30px; display: flex; gap: 20px; }
        .action-btn {
            font-family: 'Courier Prime', 'Courier New', Courier, monospace; padding: 12px 24px;
            font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer;
            border: 2px solid var(--border-main); border-radius: 4px;
            box-shadow: 4px 4px 0px var(--border-main); background-color: var(--bg-paper); color: var(--text-main);
        }
        .action-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-main); }
        .action-btn:hover { background-color: var(--btn-hover); }

        #edit-table-controls {
            display: none; gap: 15px; margin-top: 15px; flex-wrap: wrap; justify-content: center; width: 100%;
        }
        
        .stop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--bg-paper); padding: 25px; border-radius: 4px; border: 2px solid var(--border-main);
            max-width: 90%; width: 450px; text-align: center; box-shadow: 8px 8px 0px rgba(0,0,0,0.2);
        }
        .modal-input {
            width: 100%; padding: 10px; margin: 15px 0; border: 2px solid var(--border-main);
            box-sizing: border-box; font-family: monospace; background: rgba(255,255,255,0.6); color: var(--text-main);
        }
        td[contenteditable="true"] {
            cursor: text; background-color: rgba(255, 255, 255, 0.4); outline: 2px dashed var(--border-main); outline-offset: -2px;
        }

        @media (max-width: 768px) {
            #capture-area { padding: 10px; }
            .title { font-size: 20px; }
            .legend { gap: 10px; padding: 10px; }
            .legend-item { font-size: 14px; }
            .color-box { width: 18px; height: 18px; margin-right: 6px; }
            td { font-size: 10px; padding: 4px 2px; }
            .controls { flex-direction: column; width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- Панель налаштувань -->
    <div class="settings-panel">
        <div class="settings-row">
            <span class="settings-label" id="label-lang">Lang:</span>
            <button class="setting-btn active" onclick="setLang('en')" id="btn-en">EN</button>
            <button class="setting-btn" onclick="setLang('ru')" id="btn-ru">RU</button>
            <button class="setting-btn" onclick="setLang('ua')" id="btn-ua">UA</button>
        </div>

        <div class="settings-row">
            <span class="settings-label" id="label-edit-title">Table Name:</span>
            <input type="text" id="input-table-title" class="marker-input" style="width: 100%; max-width: 400px;" placeholder="Ships opinion table">
        </div>

        <div class="settings-row">
            <span class="settings-label" id="label-theme">Theme:</span>
            <button class="setting-btn active" onclick="setTheme('typewriter')" id="btn-theme-typewriter">Typewriter</button>
            <button class="setting-btn" onclick="setTheme('pastel')" id="btn-theme-pastel">Pastel Dreams</button>
            <button class="setting-btn" onclick="setTheme('dark_academia')" id="btn-theme-dark">Dark Academia</button>
            <button class="setting-btn" onclick="setTheme('custom')" id="btn-theme-custom">Custom</button>

            <div id="custom-palette-settings">
                <div class="color-picker-group"><input type="color" id="color-love" value="#ff4d4d"><label id="label-custom-love">Love</label></div>
                <div class="color-picker-group"><input type="color" id="color-like" value="#ffa64d"><label id="label-custom-like">Like</label></div>
                <div class="color-picker-group"><input type="color" id="color-platonic" value="#ffff4d"><label id="label-custom-platonic">Platonic</label></div>
                <div class="color-picker-group"><input type="color" id="color-neutral" value="#4dff4d"><label id="label-custom-neutral">Neutral</label></div>
                <div class="color-picker-group"><input type="color" id="color-dislike" value="#4dffff"><label id="label-custom-dislike">Dislike</label></div>
                <div class="color-picker-group"><input type="color" id="color-hate" value="#a64dff"><label id="label-custom-hate">Hate</label></div>
                <div class="color-picker-group" id="picker-group-custom1" style="display:none;"><input type="color" id="color-custom1" value="#ff66b2"><label id="label-custom-custom1">Marker 7</label></div>
                <div class="color-picker-group" id="picker-group-custom2" style="display:none;"><input type="color" id="color-custom2" value="#66ccff"><label id="label-custom-custom2">Marker 8</label></div>
            </div>
        </div>

        <div class="settings-row" style="flex-direction: column; align-items: flex-start;">
            <span class="settings-label" id="label-edit-names">Marker Names:</span>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%;">
                <input type="text" id="input-name-love" class="marker-input" maxlength="20">
                <input type="text" id="input-name-like" class="marker-input" maxlength="20">
                <input type="text" id="input-name-platonic" class="marker-input" maxlength="20">
                <input type="text" id="input-name-neutral" class="marker-input" maxlength="20">
                <input type="text" id="input-name-dislike" class="marker-input" maxlength="20">
                <input type="text" id="input-name-hate" class="marker-input" maxlength="20">
                <input type="text" id="input-custom1" placeholder="+ Marker 7" class="marker-input" maxlength="20">
                <input type="text" id="input-custom2" placeholder="+ Marker 8" class="marker-input" maxlength="20">
            </div>
        </div>
        
        <!-- SCORING SYSTEM -->
        <div class="settings-row" style="flex-direction: column; align-items: flex-start;">
            <span class="settings-label" id="label-scoring">Scoring (Points per cell):</span>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; font-size: 14px;">
                <label><span id="label-score-text-default">Default</span>: <input type="number" id="score-default" value="0" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-love">Love</span>: <input type="number" id="score-love" value="5" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-like">Like</span>: <input type="number" id="score-like" value="3" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-platonic">Platonic</span>: <input type="number" id="score-platonic" value="1" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-neutral">Neutral</span>: <input type="number" id="score-neutral" value="0" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-dislike">Dislike</span>: <input type="number" id="score-dislike" value="-3" class="marker-input score-input" oninput="calculateScore()"></label>
                <label><span id="label-score-text-hate">Hate</span>: <input type="number" id="score-hate" value="-5" class="marker-input score-input" oninput="calculateScore()"></label>
                <label style="display:none;" id="label-score-c1"><span id="label-score-text-custom1">Marker 7</span>: <input type="number" id="score-custom1" value="0" class="marker-input score-input" oninput="calculateScore()"></label>
                <label style="display:none;" id="label-score-c2"><span id="label-score-text-custom2">Marker 8</span>: <input type="number" id="score-custom2" value="0" class="marker-input score-input" oninput="calculateScore()"></label>
            </div>
        </div>

        <!-- SPECTRUM CONFIG -->
        <div class="settings-row" style="flex-direction: column; align-items: flex-start;">
            <span class="settings-label" id="label-spectrum-setup">Spectrum Setup (Anchors & Labels):</span>
            
            <div id="gradient-stops-list" style="display: flex; flex-direction: column; gap: 8px; width: 100%;"></div>
            <button class="setting-btn" onclick="addGradientStop()" style="margin-top: 5px;" id="btn-add-stop">+ Add Stop</button>
        </div>
    </div>

    <!-- Зона збереження картинки -->
    <div id="capture-area">
        <div class="header">
            <h1 class="title" id="ui-title">Ships opinion table</h1>
            
            <div class="legend">
                <div class="legend-item" data-state="1" id="leg-love" title="Press 1"><div class="color-box bg-love"></div> <span id="ui-love">Love</span></div>
                <div class="legend-item" data-state="2" id="leg-like" title="Press 2"><div class="color-box bg-like"></div> <span id="ui-like">Like</span></div>
                <div class="legend-item" data-state="3" id="leg-platonic" title="Press 3"><div class="color-box bg-platonic"></div> <span id="ui-platonic">Platonic</span></div>
                <div class="legend-item" data-state="4" id="leg-neutral" title="Press 4"><div class="color-box bg-neutral"></div> <span id="ui-neutral">Neutral</span></div>
                <div class="legend-item" data-state="5" id="leg-dislike" title="Press 5"><div class="color-box bg-dislike"></div> <span id="ui-dislike">Dislike</span></div>
                <div class="legend-item" data-state="6" id="leg-hate" title="Press 6"><div class="color-box bg-hate"></div> <span id="ui-hate">Hate</span></div>
                <div class="legend-item" data-state="7" id="leg-custom1" title="Press 7" style="display: none;"><div class="color-box bg-custom1"></div> <span id="ui-custom1"></span></div>
                <div class="legend-item" data-state="8" id="leg-custom2" title="Press 8" style="display: none;"><div class="color-box bg-custom2"></div> <span id="ui-custom2"></span></div>
            </div>
        </div>

        <div class="mode-indicator" id="ui-mode-hint">Mode: Cycle colors (Click a legend item or press 1-6 to paint specific colors)</div>

        <table id="ship-table">
            <!-- Таблиця генерується через JS -->
        </table>

        <!-- SPECTRUM VISUAL -->
        <div id="spectrum-container">
            <div class="spectrum-labels-top">
                <span id="ui-spec-min-val" style="position: absolute; left: 0;">-50</span>
                <span id="ui-spec-total" style="position: absolute; left: 50%; transform: translateX(-50%); text-align: center;">Score: 0</span>
                <span id="ui-spec-max-val" style="position: absolute; right: 0;">50</span>
            </div>
            
            <div id="ui-gradient-bar">
                <div id="ui-spec-marker"></div>
            </div>
            
            <!-- Dynamic Labels Go Here -->
            <div id="ui-gradient-labels"></div>
        </div>
    </div>

    <div class="controls">
        <button class="action-btn" id="download-btn">[ Download ]</button>
        <button class="action-btn" id="reset-btn">[ Reset ]</button>
        <button class="action-btn" id="edit-mode-btn">[ Edit Table ]</button>
        <button class="action-btn" id="share-btn">[ Share Link ]</button>
    </div>

    <div id="edit-table-controls">
        <button class="setting-btn" id="btn-add-row" onclick="addRow()">[ + Row ]</button>
        <button class="setting-btn" id="btn-rm-row" onclick="removeRow()">[ - Row ]</button>
        <button class="setting-btn" id="btn-add-col" onclick="addColumn()">[ + Col ]</button>
        <button class="setting-btn" id="btn-rm-col" onclick="removeColumn()">[ - Col ]</button>
        
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px; border-top: 1px dashed var(--border-main); padding-top: 15px;">
            <span class="settings-label" id="label-import">Import Data:</span>
            <textarea id="import-textarea" class="marker-input" style="width: 100%; max-width: 600px; height: 80px; resize: vertical;" placeholder="Paste text here... (Lines = Rows, Tabs/Commas = Columns)"></textarea>
            <button class="setting-btn" id="btn-import-data">[ Import ]</button>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; text-transform: uppercase;">Notification</h3>
            <p id="modal-message" style="margin-bottom: 5px;"></p>
            <input type="text" id="modal-link" class="modal-input" style="display:none;" readonly>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                <button class="setting-btn" id="modal-copy-btn" style="display:none; padding: 8px 16px;">[ Copy ]</button>
                <button class="setting-btn" id="modal-close-btn" style="padding: 8px 16px;">[ Close ]</button>
            </div>
        </div>
    </div>

    <script>
        const uiText = {
            en: {
                title: "Ships opinion table", defaultLabel: "Default", 
                love: "Love", like: "Like", platonic: "Platonic", neutral: "Neutral", dislike: "Dislike", hate: "Hate",
                download: "[ Download ]", reset: "[ Reset ]", saving: "Saving...",
                labelLang: "Lang:", labelTheme: "Theme:", labelEditNames: "Marker Names:", labelEditTitle: "Table Name:",
                labelScoring: "Scoring (Points per cell):", labelSpectrum: "Spectrum Setup (Anchors & Labels):", addStop: "+ Add Stop", scoreWord: "Score:",
                placeholder1: "+ Marker 7", placeholder2: "+ Marker 8",
                editTable: "[ Edit Table ]", doneEditing: "[ Done Editing ]",
                addRow: "[ + Row ]", removeRow: "[ - Row ]", addCol: "[ + Col ]", removeCol: "[ - Col ]",
                importData: "[ Import ]", importLabel: "Import Data:", importPlaceholder: "Paste text here...\n(Lines = Rows, Tabs/Commas = Columns)",
                share: "[ Share Link ]", shareTitle: "Share your table", shareMsg: "Copy this link to share your setup:",
                close: "[ Close ]", copy: "[ Copy ]", copied: "[ Copied! ]", errTitle: "Error", errSave: "Failed to generate link.", errLoad: "Failed to load shared table."
            },
            ru: {
                title: "Табличка мнений о корабликах", defaultLabel: "Обычный", 
                love: "Любовь", like: "Нравится", platonic: "Платоника", neutral: "Нейтрально", dislike: "Не нравится", hate: "Ненависть",
                download: "[ Скачать ]", reset: "[ Сброс ]", saving: "Сохраняем...",
                labelLang: "Язык:", labelTheme: "Тема:", labelEditNames: "Названия маркеров:", labelEditTitle: "Название таблицы:",
                labelScoring: "Очки (Баллы за ячейку):", labelSpectrum: "Спектр (Цвета и Надписи):", addStop: "+ Добавить", scoreWord: "Итог:",
                placeholder1: "+ Маркер 7", placeholder2: "+ Маркер 8",
                editTable: "[ Редактировать ]", doneEditing: "[ Готово ]",

        const shipsData = [

        const stateOrder = ['default', 'love', 'like', 'platonic', 'neutral', 'dislike', 'hate', 'custom1', 'custom2'];

        // Gradient / Spectrum Anchors

        const table = document.getElementById('ship-table');
        const root = document.documentElement;

        function setupMarkerNames() {
            const presets = ['love', 'like', 'platonic', 'neutral', 'dislike', 'hate'];
            presets.forEach(key => {
                const input = document.getElementById(`input-name-${key}`);
                input.addEventListener('input', () => {
                    const val = input.value.trim() || uiText[currentLang][key];
                    document.getElementById(`ui-${key}`).textContent = val;
                    document.getElementById(`label-custom-${key}`).textContent = val;
                    document.getElementById(`label-score-text-${key}`).textContent = val;
                    updateModeHint();
                });
            });

            const i1 = document.getElementById('input-custom1');
            const i2 = document.getElementById('input-custom2');
            
            function updateMarker(inputElem, legendElem, uiElem, stateIndex, pickerGroup, scoreContainer, scoreTextSpan) {
                const val = inputElem.value.trim();
                if(val) {
                    legendElem.style.display = 'flex';
                    uiElem.textContent = val;
                    if(!activeStates.includes(stateIndex)) activeStates.push(stateIndex);
                    activeStates.sort((a, b) => a - b);
                    if(currentTheme === 'custom' && pickerGroup) pickerGroup.style.display = 'flex';
                    
                    scoreContainer.style.display = 'block';
                    scoreTextSpan.textContent = val; 
                } else {
                    legendElem.style.display = 'none';
                    activeStates = activeStates.filter(s => s !== stateIndex);
                    if(activeBrushIndex === stateIndex) setActiveBrush(0);
                    if(pickerGroup) pickerGroup.style.display = 'none';
                    
                    scoreContainer.style.display = 'none';
                    scoreTextSpan.textContent = uiText[currentLang][stateIndex === 7 ? 'placeholder1' : 'placeholder2'];
                    document.getElementById(`score-custom${stateIndex-6}`).value = 0;
                    calculateScore();
                }
                updateModeHint();
            }

            i1.addEventListener('input', () => updateMarker(i1, document.getElementById('leg-custom1'), document.getElementById('ui-custom1'), 7, document.getElementById('picker-group-custom1'), document.getElementById('label-score-c1'), document.getElementById('label-score-text-custom1')));
            i2.addEventListener('input', () => updateMarker(i2, document.getElementById('leg-custom2'), document.getElementById('ui-custom2'), 8, document.getElementById('picker-group-custom2'), document.getElementById('label-score-c2'), document.getElementById('label-score-text-custom2')));
        }

        document.getElementById('input-table-title').addEventListener('input', (e) => {
            document.getElementById('ui-title').textContent = e.target.value.trim() || uiText[currentLang].title;
        });

        // Spectrum Editor & Calculations
        function renderGradientEditor() {
            const container = document.getElementById('gradient-stops-list');
            container.innerHTML = '';
            spectrumAnchors.forEach((stop, index) => {
                const row = document.createElement('div');
                row.className = 'stop-row';
                row.innerHTML = `
                    <label class="custom-checkbox-wrapper" title="Use Color in gradient?">
                        <input type="checkbox" class="custom-checkbox-input" ${stop.useColor ? 'checked' : ''} onchange="updateGradientStop(${index}, 'useColor', this.checked)">
                        <span class="custom-checkbox-box"></span>
                    </label>
                    <input type="color" value="${stop.color}" title="Color" onchange="updateGradientStop(${index}, 'color', this.value)" style="opacity: ${stop.useColor ? 1 : 0.3}; pointer-events: ${stop.useColor ? 'auto' : 'none'};">
                    <input type="number" class="marker-input score-input" value="${stop.pos}" min="0" max="100" title="Percentage (0-100)" onchange="updateGradientStop(${index}, 'pos', this.value)"> %
                    <input type="text" class="marker-input" style="width: 140px;" placeholder="Label (optional)" value="${stop.label || ''}" oninput="updateGradientStop(${index}, 'label', this.value)">
                    <button class="setting-btn" onclick="removeGradientStop(${index})" style="padding: 4px 8px; font-size:12px;" title="Remove">X</button>
                `;
                container.appendChild(row);
            });
            updateSpectrumBar();
        }

        function addGradientStop() {
            spectrumAnchors.push({ pos: 50, color: '#ffffff', useColor: true, label: '' });
            renderGradientEditor();
        }

        function removeGradientStop(index) {
            if(spectrumAnchors.length > 1) {
                spectrumAnchors.splice(index, 1);
                renderGradientEditor();
            }
        }

        function updateGradientStop(index, key, value) {
            spectrumAnchors[index][key] = key === 'pos' ? Math.max(0, Math.min(100, parseInt(value) || 0)) : value;
            
            if (key === 'label') {
                updateSpectrumBar(); // Only redraw spectrum to keep focus in the text field
            } else {
                renderGradientEditor(); // Redraw whole row for color/pos changes
            }
        }

        function updateSpectrumBar() {
            const sorted = [...spectrumAnchors].sort((a,b) => a.pos - b.pos);
            
            // Rebuild Gradient (Only anchors with useColor = true)
            const colorStops = sorted.filter(s => s.useColor);
            let gradientStr = colorStops.map(s => `${s.color} ${s.pos}%`).join(', ');
            if (colorStops.length === 0) gradientStr = 'transparent';
            else if (colorStops.length === 1) gradientStr = `${colorStops[0].color}, ${colorStops[0].color}`;
            
            document.getElementById('ui-gradient-bar').style.background = `linear-gradient(to right, ${gradientStr})`;
            
            // Rebuild text labels - using transform technique to prevent any overflow!
            const labelsContainer = document.getElementById('ui-gradient-labels');
            labelsContainer.innerHTML = '';
            sorted.forEach(stop => {
                if (stop.label && stop.label.trim() !== '') {
                    const span = document.createElement('span');
                    span.textContent = stop.label;
                    span.style.position = 'absolute';
                    span.style.left = `${stop.pos}%`;
                    span.style.transform = `translateX(-${stop.pos}%)`; // Ensures it always stays strictly within frame bounds
                    span.style.fontSize = '14px';
                    span.style.fontWeight = 'bold';
                    span.style.whiteSpace = 'nowrap';
                    labelsContainer.appendChild(span);
                }
            });

            calculateScore(); 
        }

        function calculateScore() {
            let total = 0;
            const cells = table.getElementsByTagName('td');
            const numCells = cells.length || 1; 
            
            const points = {
                0: parseInt(document.getElementById('score-default').value) || 0,
                1: parseInt(document.getElementById('score-love').value) || 0,
                2: parseInt(document.getElementById('score-like').value) || 0,
                3: parseInt(document.getElementById('score-platonic').value) || 0,
                4: parseInt(document.getElementById('score-neutral').value) || 0,
                5: parseInt(document.getElementById('score-dislike').value) || 0,
                6: parseInt(document.getElementById('score-hate').value) || 0,
                7: parseInt(document.getElementById('score-custom1').value) || 0,
                8: parseInt(document.getElementById('score-custom2').value) || 0
            };

            for(let cell of cells) {
                total += points[cell.dataset.stateIndex || 0];
            }

            // AUTO CALCULATE MIN AND MAX BOUNDS
            let availableScores = activeStates.map(idx => points[idx]);
            if (!activeStates.includes(0)) availableScores.push(points[0]); // Ensure Default is considered

            let minScore = Math.min(...availableScores);
            let maxScore = Math.max(...availableScores);

            let minPossible = minScore * numCells;
            let maxPossible = maxScore * numCells;

            if (minPossible === maxPossible) maxPossible += 1;

            document.getElementById('ui-spec-min-val').textContent = minPossible;
            document.getElementById('ui-spec-max-val').textContent = maxPossible;
            document.getElementById('ui-spec-total').textContent = `${uiText[currentLang].scoreWord} ${total}`;

            let range = maxPossible - minPossible;
            let percent = ((total - minPossible) / range) * 100;
            percent = Math.max(0, Math.min(100, percent)); 

            document.getElementById('ui-spec-marker').style.left = `${percent}%`;
        }

        function cellClickHandler(e) {
            if (isEditMode) return;
            const cell = e.currentTarget;
            
            if (activeBrushIndex === 0) {
                let currentIndex = parseInt(cell.dataset.stateIndex || 0);
                let activeIdx = activeStates.indexOf(currentIndex);
                if(activeIdx === -1) activeIdx = 0;
                cell.dataset.stateIndex = activeStates[(activeIdx + 1) % activeStates.length];
            } else {
                let currentIndex = parseInt(cell.dataset.stateIndex || 0);
                cell.dataset.stateIndex = (currentIndex === activeBrushIndex) ? 0 : activeBrushIndex;
            }
            updateCellColor(cell);
            calculateScore(); 
        }

        function initTable() {
            table.innerHTML = '';
            shipsData.forEach((rowData) => {
                const tr = document.createElement('tr');
                rowData.forEach((shipName) => {
                    const td = document.createElement('td');
                    td.dataset.stateIndex = 0; 
                    td.textContent = shipName;
                    td.addEventListener('click', cellClickHandler);
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            calculateScore();
        }

        function updateCellColor(cell) {
            const stateName = stateOrder[cell.dataset.stateIndex || 0];
            cell.style.backgroundColor = themes[currentTheme].colors[stateName];
        }

        function refreshTableColors() {
            const cells = table.getElementsByTagName('td');
            for (let cell of cells) updateCellColor(cell);
            
            for(let key in themes[currentTheme].colors) {
                root.style.setProperty(`--color-${key}`, themes[currentTheme].colors[key]);
            }
        }

        function setTheme(themeName) {
            currentTheme = themeName;
            document.querySelectorAll('[id^="btn-theme-"]').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-theme-${themeName === 'dark_academia' ? 'dark' : themeName}`).classList.add('active');

            const customPanel = document.getElementById('custom-palette-settings');
            customPanel.style.display = themeName === 'custom' ? 'flex' : 'none';
            if(themeName === 'custom') {
                document.getElementById('picker-group-custom1').style.display = document.getElementById('input-custom1').value.trim() ? 'flex' : 'none';
                document.getElementById('picker-group-custom2').style.display = document.getElementById('input-custom2').value.trim() ? 'flex' : 'none';
            }

            for (const [key, value] of Object.entries(themes[themeName].vars)) {
                root.style.setProperty(key, value);
            }
            refreshTableColors();
        }

        document.querySelectorAll('input[type="color"]').forEach(input => {
            if(!input.onchange) { 
                input.addEventListener('input', function() {
                    if (currentTheme === 'custom') {
                        themes.custom.colors[this.id.replace('color-', '')] = this.value;
                        refreshTableColors();
                    }
                });
            }
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                if(['btn-en','btn-ru','btn-ua'].includes(btn.id)) btn.classList.remove('active');
            });
            document.getElementById(`btn-${lang}`).classList.add('active');

            const t = uiText[lang];
            
            document.getElementById('label-score-text-default').textContent = t.defaultLabel;
            
            ['love', 'like', 'platonic', 'neutral', 'dislike', 'hate'].forEach(key => {
                const input = document.getElementById(`input-name-${key}`);
                input.value = t[key];
                document.getElementById(`ui-${key}`).textContent = input.value;
                document.getElementById(`label-custom-${key}`).textContent = input.value;
                document.getElementById(`label-score-text-${key}`).textContent = input.value;

            document.getElementById('label-spectrum-setup').textContent = t.labelSpectrum;
            document.getElementById('btn-add-stop').textContent = t.addStop;
            
            document.getElementById('download-btn').textContent = t.download;
            document.getElementById('reset-btn').textContent = t.reset;
            document.getElementById('label-lang').textContent = t.labelLang;
            document.getElementById('label-theme').textContent = t.labelTheme;
            document.getElementById('label-edit-names').textContent = t.labelEditNames;

            document.getElementById('input-custom2').placeholder = t.placeholder2;
            document.getElementById('label-score-text-custom1').textContent = document.getElementById('input-custom1').value.trim() || t.placeholder1;
            document.getElementById('label-score-text-custom2').textContent = document.getElementById('input-custom2').value.trim() || t.placeholder2;

        document.getElementById('reset-btn').addEventListener('click', () => {
            const cells = table.getElementsByTagName('td');

            calculateScore();
        });
        
        function setActiveBrush(index) {
            activeBrushIndex = index;
            document.querySelectorAll('.legend-item').forEach(item => item.classList.remove('active-brush'));
            if (index > 0) document.querySelector(`.legend-item[data-state="${index}"]`).classList.add('active-brush');
            updateModeHint();
        }

        function updateModeHint() {
            const hintEl = document.getElementById('ui-mode-hint');
            if (activeBrushIndex === 0) {
                if(currentLang === 'ua') hintEl.textContent = "Режим: Циклічний (Натисніть на легенду або цифри 1-8)";
                else if(currentLang === 'ru') hintEl.textContent = "Режим: Циклический (Нажмите на легенду или цифры 1-8)";
                else hintEl.textContent = "Mode: Cycle colors (Click a legend item or press 1-8)";
            } else {
                let c = (activeBrushIndex === 7) ? document.getElementById('input-custom1').value :
                        (activeBrushIndex === 8) ? document.getElementById('input-custom2').value :
                        document.getElementById(`input-name-${stateOrder[activeBrushIndex]}`).value || uiText[currentLang][stateOrder[activeBrushIndex]];
                if(currentLang === 'ua') hintEl.textContent = `Режим: Малювання (${c}). Натисніть Esc для скасування.`;
                else if(currentLang === 'ru') hintEl.textContent = `Режим: Рисование (${c}). Нажмите Esc для отмены.`;
                else hintEl.textContent = `Mode: Painting (${c}). Press Esc to cancel.`;
            }
        }

        document.querySelectorAll('.legend-item').forEach(item => {
            item.addEventListener('click', function() { setActiveBrush(activeBrushIndex === parseInt(this.dataset.state) ? 0 : parseInt(this.dataset.state)); });
        });

        document.addEventListener('keydown', function(event) {
            if (event.key >= '1' && event.key <= '8') {
                const s = parseInt(event.key);
                if(s < 7 || activeStates.includes(s)) setActiveBrush(s);
            }
            if (event.key === 'Escape') setActiveBrush(0);
        });

        document.getElementById('edit-mode-btn').addEventListener('click', () => {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-mode-btn');
            const controls = document.getElementById('edit-table-controls');
            const cells = table.getElementsByTagName('td');
            if (isEditMode) {
                btn.textContent = uiText[currentLang].doneEditing; btn.classList.add('active'); controls.style.display = 'flex';
                for(let cell of cells) cell.setAttribute('contenteditable', 'true');
                setActiveBrush(0); 
            } else {
                btn.textContent = uiText[currentLang].editTable; btn.classList.remove('active'); controls.style.display = 'none';
                for(let cell of cells) cell.setAttribute('contenteditable', 'false');
            }
        });

        function addRow() {
            const cols = table.querySelector('tr')?.children.length || 4;
            const tr = document.createElement('tr');
            for(let i=0; i < cols; i++) {
                const td = document.createElement('td'); td.dataset.stateIndex = 0; td.textContent = "new/ship";
                td.setAttribute('contenteditable', 'true'); td.addEventListener('click', cellClickHandler); tr.appendChild(td);
            }
            table.appendChild(tr); refreshTableColors(); calculateScore();
        }

        function removeRow() { if(table.querySelectorAll('tr').length > 1) table.removeChild(table.lastElementChild); calculateScore(); }
        
        function addColumn() {
            table.querySelectorAll('tr').forEach(tr => {
                const td = document.createElement('td'); td.dataset.stateIndex = 0; td.textContent = "new/ship";
                td.setAttribute('contenteditable', 'true'); td.addEventListener('click', cellClickHandler); tr.appendChild(td);
            });
            refreshTableColors(); calculateScore();
        }

        function removeColumn() {
            const rows = table.querySelectorAll('tr');
            if(rows[0] && rows[0].children.length > 1) { rows.forEach(tr => tr.removeChild(tr.lastElementChild)); calculateScore(); }
        }

        document.getElementById('btn-import-data').addEventListener('click', () => {
            const text = document.getElementById('import-textarea').value.trim();
            if (!text) return;
            table.innerHTML = '';
            text.split('\n').forEach(line => {
                const tr = document.createElement('tr');
                const cols = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : [line]);
                cols.forEach(colData => {
                    const td = document.createElement('td'); td.dataset.stateIndex = 0; td.textContent = colData.trim();
                    td.setAttribute('contenteditable', 'true'); td.addEventListener('click', cellClickHandler); tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            refreshTableColors(); calculateScore();
            document.getElementById('import-textarea').value = '';
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const captureArea = document.getElementById('capture-area');
            const originalBtnText = document.getElementById('download-btn').textContent;
            document.getElementById('download-btn').textContent = `[ ${uiText[currentLang].saving} ]`;
            html2canvas(captureArea, { scale: 2, backgroundColor: themes[currentTheme].vars['--bg-paper'], useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `ships_opinion_${currentTheme}_${currentLang}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                document.getElementById('download-btn').textContent = originalBtnText;
            }).catch(err => {
                showModal(uiText[currentLang].errTitle, "Photo save error. Try manual screenshot.");
                document.getElementById('download-btn').textContent = originalBtnText;
            });
        });

        function showModal(title, message, link = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            const linkInput = document.getElementById('modal-link'); const copyBtn = document.getElementById('modal-copy-btn');
            if (link) {
                linkInput.style.display = 'block'; linkInput.value = link; copyBtn.style.display = 'block';
                copyBtn.onclick = () => { linkInput.select(); document.execCommand('copy'); copyBtn.textContent = uiText[currentLang].copied; setTimeout(() => copyBtn.textContent = uiText[currentLang].copy, 2000); };
            } else { linkInput.style.display = 'none'; copyBtn.style.display = 'none'; }
            document.getElementById('custom-modal').style.display = 'flex';
        }

        document.getElementById('modal-close-btn').addEventListener('click', () => document.getElementById('custom-modal').style.display = 'none');

        // SHARE LINK LOGIC
        function generateShareLink() {
            try {
                const tableData = [];
                document.querySelectorAll('#ship-table tr').forEach(row => {
                    const rowData = [];
                    row.querySelectorAll('td').forEach(cell => rowData.push({ text: cell.textContent, stateIndex: parseInt(cell.dataset.stateIndex || 0) }));
                    tableData.push(rowData);
                });

                const scores = {
                    0: document.getElementById('score-default').value, 1: document.getElementById('score-love').value,
                    2: document.getElementById('score-like').value, 3: document.getElementById('score-platonic').value,
                    4: document.getElementById('score-neutral').value, 5: document.getElementById('score-dislike').value,
                    6: document.getElementById('score-hate').value, 7: document.getElementById('score-custom1').value,
                    8: document.getElementById('score-custom2').value
                };

                const state = { 
                    grid: tableData, theme: currentTheme, lang: currentLang, customColors: themes.custom.colors,
                    customTitle: document.getElementById('input-table-title').value.trim(),
                    markerNames: { love: document.getElementById('input-name-love').value, like: document.getElementById('input-name-like').value, platonic: document.getElementById('input-name-platonic').value, neutral: document.getElementById('input-name-neutral').value, dislike: document.getElementById('input-name-dislike').value, hate: document.getElementById('input-name-hate').value, custom1: document.getElementById('input-custom1').value, custom2: document.getElementById('input-custom2').value },
                    scores: scores, spectrumStops: spectrumAnchors
                };
                
                const shareUrl = window.location.origin + window.location.pathname + '?map=' + LZString.compressToEncodedURIComponent(JSON.stringify(state));
                showModal(uiText[currentLang].shareTitle, uiText[currentLang].shareMsg, shareUrl);
            } catch (e) { showModal(uiText[currentLang].errTitle, uiText[currentLang].errSave); }
        }

        function loadSharedLink() {
            const mapData = new URLSearchParams(window.location.search).get('map');
            if (mapData) {
                try {
                    const state = JSON.parse(LZString.decompressFromEncodedURIComponent(mapData));
                    if (state.lang) setLang(state.lang);
                    if (state.customTitle) { document.getElementById('input-table-title').value = state.customTitle; document.getElementById('ui-title').textContent = state.customTitle; }
                    if (state.customColors) {
                        themes.custom.colors = state.customColors;
                        Object.keys(state.customColors).forEach(k => { if(document.getElementById('color-' + k)) document.getElementById('color-' + k).value = state.customColors[k]; });
                    }
                    if (state.theme) setTheme(state.theme);
                    if (state.markerNames) {
                        Object.keys(state.markerNames).forEach(k => {
                            const inp = document.getElementById(k.startsWith('custom') ? 'input-' + k : 'input-name-' + k);
                            if (inp && state.markerNames[k]) { inp.value = state.markerNames[k]; inp.dispatchEvent(new Event('input')); }
                        });
                    }
                    if(state.scores) {
                        document.getElementById('score-default').value = state.scores[0] || 0; document.getElementById('score-love').value = state.scores[1] || 0;
                        document.getElementById('score-like').value = state.scores[2] || 0; document.getElementById('score-platonic').value = state.scores[3] || 0;
                        document.getElementById('score-neutral').value = state.scores[4] || 0; document.getElementById('score-dislike').value = state.scores[5] || 0;
                        document.getElementById('score-hate').value = state.scores[6] || 0; document.getElementById('score-custom1').value = state.scores[7] || 0;
                        document.getElementById('score-custom2').value = state.scores[8] || 0;
                    }
                    
                    if(state.spectrumStops) {
                        spectrumAnchors = state.spectrumStops.map(s => ({
                            pos: s.pos, color: s.color, label: s.label || '', 
                            useColor: s.useColor !== undefined ? s.useColor : true 
                        }));
                    }

                    if (state.grid && state.grid.length > 0) {
                        table.innerHTML = '';
                        state.grid.forEach(rowData => {
                            const tr = document.createElement('tr');
                            rowData.forEach(cellData => {
                                const td = document.createElement('td'); td.dataset.stateIndex = cellData.stateIndex;
                                td.innerHTML = cellData.text; td.setAttribute('contenteditable', 'false'); td.addEventListener('click', cellClickHandler);
                                updateCellColor(td); tr.appendChild(td);
                            });
                            table.appendChild(tr);
                        });
                    }
                } catch (error) { showModal(uiText[currentLang].errTitle, uiText[currentLang].errLoad); }
            }
            renderGradientEditor(); 
        }

        document.getElementById('share-btn').addEventListener('click', generateShareLink);

        setupMarkerNames();
        initTable();
        setTheme('typewriter'); 
        setLang('en'); 
        loadSharedLink(); 
    </script>
</body>
</html>
